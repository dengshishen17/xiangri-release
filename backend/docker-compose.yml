# ==========================================================================
# 巷里 XIANGRI · 后端本地/单机部署编排
# ==========================================================================
# 使用方式：
#   1. 复制 .env.example 为 .env 并填入真实值（.env 不入库）
#   2. docker compose up -d
#
# 敏感配置一律从 .env / 宿主环境变量读取，compose 文件内不含真实密码。
# ==========================================================================

services:
  backend-8081:
    image: xiangri-backend:latest
    container_name: hmdp-backend-8081
    restart: unless-stopped
    environment:
      SERVER_PORT: "8081"
      DB_URL: "${DB_URL:-jdbc:mysql://host.docker.internal:3306/hmdp?useSSL=false&serverTimezone=UTC}"
      DB_USERNAME: "${DB_USERNAME:-root}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      REDIS_HOST: "${REDIS_HOST:-hmdp-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
      IMAGE_UPLOAD_DIR: "/app/imgs"
    ports:
      - "8081:8081"
    volumes:
      - "${IMAGE_UPLOAD_HOST_DIR:-./imgs}:/app/imgs:rw"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - hmdp-net

  backend-8082:
    image: xiangri-backend:latest
    container_name: hmdp-backend-8082
    restart: unless-stopped
    environment:
      SERVER_PORT: "8082"
      DB_URL: "${DB_URL:-jdbc:mysql://host.docker.internal:3306/hmdp?useSSL=false&serverTimezone=UTC}"
      DB_USERNAME: "${DB_USERNAME:-root}"
      DB_PASSWORD: "${DB_PASSWORD:?DB_PASSWORD is required}"
      REDIS_HOST: "${REDIS_HOST:-hmdp-redis}"
      REDIS_PORT: "${REDIS_PORT:-6379}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"
      IMAGE_UPLOAD_DIR: "/app/imgs"
    ports:
      - "8082:8082"
    volumes:
      - "${IMAGE_UPLOAD_HOST_DIR:-./imgs}:/app/imgs:rw"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - hmdp-net

  # 本地 Redis，密码来自 .env 的 REDIS_PASSWORD，不写死在 compose 中。
  # 默认不启动（profile=local-infra），避免与已有容器重名。
  redis:
    image: redis:7
    container_name: hmdp-redis
    profiles: ["local-infra"]
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}", "--appendonly", "yes"]
    # 发布到宿主机，便于用 Redis 客户端（如 Another Redis Desktop Manager）直连查看验证码等数据
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - hmdp-net

volumes:
  redis-data:

networks:
  hmdp-net:
    name: hmdp-net
    external: true
