<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>我的 · 巷里 XIANGRI</title>
  <link rel="stylesheet" href="./css/element.css">
  <link href="./css/main.css" rel="stylesheet">
  <link href="./css/info.css" rel="stylesheet">
</head>
<body>
<div id="app" class="app-profile has-dock">
  <!-- 顶部品牌栏 -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M5 20V11.5L12 6l7 5.5V20" stroke="#F7F4ED" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9.6 20v-4.6a2.4 2.4 0 0 1 4.8 0V20" stroke="#F0A04B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="12" cy="4" r="1.2" fill="#F0A04B"/>
        </svg>
      </div>
      <div class="brand-name">巷里<small>XIANGRI</small></div>
    </div>
    <div style="flex:1"></div>
    <div class="icon-btn" @click="goBack" title="返回">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.5 5.5 8 12l6.5 6.5"/>
      </svg>
    </div>
  </header>

  <!-- 个人封面 -->
  <section class="profile-hero">
    <div class="profile-row">
      <div class="profile-avatar">
        <img :src="user.icon || '/imgs/icons/default-icon.png'" alt="">
      </div>
      <div class="profile-meta">
        <h1 class="profile-name">{{user.nickName}}</h1>
        <div class="profile-tags">
          <span class="chip">杭州</span>
          <span class="chip chip-accent">巷里居民</span>
        </div>
        <div class="profile-intro" v-if="info.introduce">{{info.introduce}}</div>
        <div class="profile-intro profile-intro-empty" v-else>
          添加个人简介，让大家更好地认识你
        </div>
      </div>
    </div>
    <div class="profile-actions">
      <div class="btn btn-ghost btn-sm" @click="toEdit">编辑资料</div>
      <div class="btn btn-quiet btn-sm" @click="logout">退出登录</div>
    </div>
  </section>

  <!-- 内容标签页 -->
  <div class="content">
    <el-tabs v-model="activeName" @tab-click="handleClick">
      <el-tab-pane label="笔记" name="1">
        <div class="note-list">
          <div v-for="b in blogs" :key="b.id" class="note-row" @click="toBlogDetail(b)">
            <div class="nr-cover"><img :src="b.images.split(',')[0]" alt=""></div>
            <div class="nr-body">
              <div class="nr-title">{{b.title}}</div>
              <div class="nr-meta">
                <span class="nr-like">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M7 21H4.6A1.6 1.6 0 0 1 3 19.4V10l4.2-6.4a1.6 1.6 0 0 1 2.8 1.6L9.4 9H18a2 2 0 0 1 2 2.4l-1.4 7A2 2 0 0 1 16.6 20H7z"/>
                  </svg>
                  {{b.liked}}
                </span>
                <span class="nr-comment">
                  <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M20 12.5c0 3.9-3.6 7-8 7-1 0-2-.2-2.9-.5L4 20l1.4-3.8C4.5 15.2 4 13.9 4 12.5c0-3.9 3.6-7 8-7s8 3.1 8 7z"/>
                  </svg>
                  {{b.comments}}
                </span>
              </div>
            </div>
          </div>
          <div class="list-end" v-if="blogs.length === 0">还没有笔记，去分享第一条吧</div>
        </div>
      </el-tab-pane>
      <el-tab-pane label="评价" name="2">
        <div class="tab-empty">评价功能即将上线</div>
      </el-tab-pane>
      <el-tab-pane label="粉丝(0)" name="3">
        <div class="tab-empty">还没有粉丝</div>
      </el-tab-pane>
      <el-tab-pane label="关注(0)" name="4">
        <div class="blog-list" @scroll="onScroll">
          <div class="feed-list">
            <article class="feed-row" v-for="b in blogs2" :key="b.id" @click="toBlogDetail(b)">
              <div class="fr-body">
                <h3 class="fr-title">{{b.title}}</h3>
                <div class="fr-meta">
                  <span class="fr-author">{{b.name}}</span>
                  <span class="fr-like" @click.stop="addLike(b)">
                    <svg width="13" height="13" viewBox="0 0 24 24" :fill="b.isLike ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                      <path d="M7 21H4.6A1.6 1.6 0 0 1 3 19.4V10l4.2-6.4a1.6 1.6 0 0 1 2.8 1.6L9.4 9H18a2 2 0 0 1 2 2.4l-1.4 7A2 2 0 0 1 16.6 20H7z"/>
                    </svg>
                    {{b.liked}}
                  </span>
                </div>
              </div>
              <div class="fr-cover">
                <img :src="b.img" alt="">
              </div>
            </article>
            <div class="list-end" v-if="blogs2.length === 0">关注的人还没有发布内容</div>
          </div>
        </div>
      </el-tab-pane>
    </el-tabs>
  </div>

  <foot-bar :active-btn="4"></foot-bar>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<script src="./js/element.js"></script>
<script src="./js/common.js"></script>
<script src="./js/footer.js"></script>
<script>
  const app = new Vue({
    el: "#app",
    data: {
      user: "",
      activeName: "1",
      info: {},
      blogs: [],
      blogs2: [], // 关注的人的播客
      params: {
        minTime: 0, // 上一次拉取到的时间戳
        offset: 0, // 偏移量
      },
      count: 5,
      isReachBottom: false,
    },
    created() {
      this.queryUser();
    },
    methods: {
      load() {
        this.count += 2;
      },
      queryBlogs() {
        axios.get("/blog/of/me")
          .then(({data}) => this.blogs = data)
          .catch(this.$message.error)
      },
      queryBlogsOfFollow(clear) {
        if (clear) {
          this.params.offset = 0;
          this.params.minTime = new Date().getTime() + 1;
        }
        let {minTime, offset: os} = this.params;
        axios.get("/blog/of/follow", {
            params: {offset: os, lastId: minTime || new Date().getTime() + 1}
          })
          .then(({data}) => {
            if (!data) {
              return;
            }
            let {list, ...params} = data;
            list.forEach(b => b.img = b.images.split(",")[0])
            this.blogs2 = clear ? list : this.blogs2.concat(list);
            this.params = params;
          })
          .catch(e => console.log(e))
      },
      queryUser() {
        // 查询用户信息
        axios.get("/user/me")
          .then(({data}) => {
            // 保存用户
            this.user = data;
            // 查询用户详情
            this.queryUserInfo();
            // 查询用户笔记
            this.queryBlogs();
          })
          .catch(err => {
            location.href = "login.html"
          })
      },
      goBack() {
        history.back();
      },
      queryUserInfo() {
        axios.get("/user/info/" + this.user.id)
          .then(({data}) => {
            if (!data) {
              return
            }
            // 保存用户详情
            this.info = data;
            // 保存到本地
            sessionStorage.setItem("userInfo", JSON.stringify(data))
          })
          .catch(err => {
            this.$message.error(err);
          })
      },
      toEdit() {
        location.href = 'info-edit.html'
      },
      logout() {
        axios.post("/user/logout")
          .then(() => {
            // 清理session
            sessionStorage.removeItem("token")
            // 跳转
            location.href = "/"
          })
          .catch(this.$message.error)
      },
      handleClick(r) {
        if (r.name === '4') {
          this.queryBlogsOfFollow(true);
        }
      },
      addLike(b) {
        axios.put("/blog/like/" + b.id)
          .then(({data}) => {
            this.queryBlogById(b);
          })
          .catch(err => {
            this.$message.error(err)
          })
      },
      queryBlogById(b) {
        axios.get("/blog/" + b.id)
          .then(({data}) => {
            b.liked = data.liked;
            b.isLike = data.isLike;
          })
          .catch(() => {
            this.$message.error
            b.liked++;
          })
      },
      toBlogDetail(b) {
        location.href = "/blog-detail.html?id=" + b.id
      },
      onScroll(e) {
        let scrollTop = e.target.scrollTop;
        let offsetHeight = e.target.offsetHeight;
        let scrollHeight = e.target.scrollHeight;
        if (scrollTop === 0) {
          // 到顶部了，查询一次
          this.queryBlogsOfFollow(true);
        } else if (scrollTop + offsetHeight + 1 > scrollHeight && !this.isReachBottom) {
          this.isReachBottom = true
          // 再次查询下一页数据
          this.queryBlogsOfFollow();
        } else {
          this.isReachBottom = false
        }
      }
    },

  })
</script>
</body>
</html>
