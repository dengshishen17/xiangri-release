<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>登录 · 巷里 XIANGRI</title>
  <link rel="stylesheet" href="./css/element.css">
  <link href="./css/main.css" rel="stylesheet">
  <link href="./css/login.css" rel="stylesheet">
</head>
<body>
<div id="app" class="app-login">
  <!-- 品牌区 -->
  <div class="login-brand">
    <div class="lb-mark">
      <svg width="34" height="34" viewBox="0 0 24 24" fill="none">
        <path d="M5 20V11.5L12 6l7 5.5V20" stroke="#F7F4ED" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M9.6 20v-4.6a2.4 2.4 0 0 1 4.8 0V20" stroke="#F0A04B" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
        <circle cx="12" cy="4" r="1.2" fill="#F0A04B"/>
      </svg>
    </div>
    <h1 class="lb-name">巷里</h1>
    <div class="lb-en">XIANGRI</div>
    <p class="lb-slogan">城市生活手边指南</p>
    <div class="lb-deco">
      <span></span><span></span><span></span>
    </div>
  </div>

  <!-- 登录卡片 -->
  <div class="login-card">
    <div class="lc-title">手机号快捷登录</div>
    <div class="lc-sub">未注册的手机号验证后自动创建账户</div>

    <div class="lc-field">
      <div class="lc-field-label">手机号</div>
      <el-input placeholder="请输入手机号" v-model="form.phone" class="lc-input"></el-input>
    </div>

    <div class="lc-field">
      <div class="lc-field-label">验证码</div>
      <div class="lc-code">
        <el-input placeholder="请输入验证码" v-model="form.code" class="lc-input"></el-input>
        <div class="lc-code-btn" :class="{ 'is-disabled': disabled }" @click="sendCode">{{codeBtnMsg}}</div>
      </div>
    </div>

    <div class="btn btn-primary btn-block lc-submit" @click="login">登 录</div>

    <div class="lc-switch">
      <a href="/login2.html">使用密码登录</a>
    </div>

    <div class="login-radio">
      <div class="lr-check" :class="{ 'is-checked': radio }" @click="radio = radio ? '' : '1'">
        <svg v-if="radio" width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 12.5 10 17l9-10"/>
        </svg>
      </div>
      <div class="lr-text">
        我已阅读并同意
        <a href="javascript:void(0)">《巷里用户服务协议》</a>、
        <a href="javascript:void(0)">《隐私政策》</a>
        等，接受免除或者限制责任、诉讼管辖约定等粗体标示条款
      </div>
    </div>
  </div>

  <div class="login-foot">© 2026 巷里 XIANGRI · 城市生活手边指南</div>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<script src="./js/element.js"></script>
<script src="./js/common.js"></script>
<script src="./js/footer.js"></script>
<script>
  const app = new Vue({
    el: "#app",
    data: {
      radio: "",
      disabled: false, // 发送短信按钮
      codeBtnMsg: "发送验证码", // 发送短信按钮提示
      form:{
      }
    },
    methods: {
      login(){
        if(!this.radio){
          this.$message.error("请先确认阅读用户协议！");
          return
        }
        if(!this.form.phone || !this.form.code){
          this.$message.error("手机号和验证码不能为空！");
          return
        }
        axios.post("/user/login", this.form)
        .then(({data}) => {
            if(data){
              // 保存用户信息到session
              sessionStorage.setItem("token", data);
            }
            // 跳转到首页
            location.href = "/index.html"
        })
        .catch(err => this.$message.error(err))
      },
      goBack(){
        history.back();
      },
      sendCode(){
        if (!this.form.phone) {
          this.$message.error("手机号不能为空");
          return;
        }
        // 发送验证码
        axios.post("/user/code?phone="+this.form.phone)
          .then(() => {})
          .catch(err => {
            console.log(err);
            this.$message.error(err)
          });
        // 禁用按钮
        this.disabled = true;
        // 按钮倒计时
        let i = 60;
        this.codeBtnMsg = (i--) + '秒后可重发'
        let taskId = setInterval(() => this.codeBtnMsg = (i--) + '秒后可重发', 1000);
        setTimeout(() => {
          this.disabled = false;
          clearInterval(taskId);
          this.codeBtnMsg = "发送验证码";
        }, 59000)
      }
    }
  })
</script>
</body>
</html>
