<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <title>商户列表 · 巷里 XIANGRI</title>
  <link rel="stylesheet" href="./css/element.css">
  <link href="./css/main.css" rel="stylesheet">
  <link href="./css/shop-list.css" rel="stylesheet">
</head>
<body>
<div id="app" class="app-shoplist">
  <!-- 顶部品牌栏 -->
  <header class="topbar">
    <div class="icon-btn" @click="goBack" title="返回">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M14.5 5.5 8 12l6.5 6.5"/>
      </svg>
    </div>
    <div class="brand">
      <div class="brand-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M5 20V11.5L12 6l7 5.5V20" stroke="#F7F4ED" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9.6 20v-4.6a2.4 2.4 0 0 1 4.8 0V20" stroke="#F0A04B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="12" cy="4" r="1.2" fill="#F0A04B"/>
        </svg>
      </div>
      <div class="brand-name">巷里<small>XIANGRI</small></div>
    </div>
    <div style="flex:1"></div>
    <div class="icon-btn" title="搜索">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>
      </svg>
    </div>
  </header>

  <!-- 标题区 -->
  <div class="sl-hero">
    <div class="u-eyebrow">Shops</div>
    <h1 class="u-title-lg">{{typeName}}</h1>
    <p class="sl-sub">城市生活手边指南 · 为你挑了这一带</p>
  </div>

  <!-- 排序筛选 -->
  <div class="sort-bar">
    <div class="sort-item" :class="{ 'is-active': params.sortBy === '' }" @click="sortAndQuery('')">
      距离
    </div>
    <div class="sort-item" :class="{ 'is-active': params.sortBy === 'comments' }" @click="sortAndQuery('comments')">
      人气
    </div>
    <div class="sort-item" :class="{ 'is-active': params.sortBy === 'score' }" @click="sortAndQuery('score')">
      评分
    </div>
    <div class="sort-item sort-switch">
      <el-dropdown trigger="click" @command="handleCommand">
        <span class="el-dropdown-link">
          切换品类<i class="el-icon-arrow-down el-icon--right"></i>
        </span>
        <el-dropdown-menu slot="dropdown">
          <el-dropdown-item v-for="t in types" :key="t.id" :command="t">
            {{t.name}}
          </el-dropdown-item>
        </el-dropdown-menu>
      </el-dropdown>
    </div>
  </div>

  <!-- 商户列表 -->
  <div class="shop-list" @scroll="onScroll">
    <div class="shop-box" v-for="s in shops" :key="s.id" @click="toDetail(s.id)">
      <div class="shop-img"><img :src="s.images" alt=""></div>
      <div class="shop-info">
        <div class="shop-head">
          <div class="shop-title">{{s.name}}</div>
          <div class="shop-score num">{{s.score}}</div>
        </div>
        <div class="shop-rate">
          <el-rate disabled v-model="s.score/10" text-color="#F0A04B"></el-rate>
          <span class="shop-comments num">{{s.comments}} 条</span>
        </div>
        <div class="shop-tags">
          <span class="chip chip-line">{{s.area}}</span>
          <span class="chip chip-line" v-if="s.distance">{{s.distance < 1000 ? s.distance.toFixed(1) + 'm' : (s.distance/1000).toFixed(1) + 'km'}}</span>
        </div>
        <div class="shop-foot">
          <div class="shop-price price">￥{{s.avgPrice}}<small>/人</small></div>
          <div class="shop-address">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M12 21s7-5.6 7-11a7 7 0 1 0-14 0c0 5.4 7 11 7 11z"/>
              <circle cx="12" cy="10" r="2.4"/>
            </svg>
            <span>{{s.address}}</span>
          </div>
        </div>
      </div>
    </div>
    <div class="list-end" v-if="isReachBottom">— 已加载全部 —</div>
  </div>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<script src="./js/element.js"></script>
<script src="./js/common.js"></script>
<script>
  const app = new Vue({
    el: "#app",
    data: {
      util,
      isReachBottom: false,
      types: [], // 类型列表
      shops: [], // 商店列表
      typeName: "",
      params:{
        typeId: 0,
        current: 1,
        sortBy: "",
        x: 120.149993, // 经度
        y: 30.334229 // 纬度
      }
    },
    created() {
      // 获取参数
      this.params.typeId = util.getUrlParam("type");
      this.typeName = util.getUrlParam("name");
      // 查询类型
      this.queryTypes();
      // 查询商店
      this.queryShops();
    },
    methods: {
      queryTypes() {
        axios.get("/shop-type/list")
          .then(({data}) => {
            this.types = data;
          })
          .catch(err => {
            console.log(err);
            this.$message.error(err)
          })
      },
      queryShops() {
        axios.get("/shop/of/type", {
          params: this.params
        })
          .then(({data}) => {
            if (!data) {
              return
            }
            data.forEach(s => s.images = s.images.split(',')[0]);
            this.shops = this.shops.concat(data);
          })
          .catch(err => {
            console.log(err);
            this.$message.error(err)
          })
      },
      handleCommand(t) {
        location.href = "/shop-list.html?type="+t.id+"&name="+t.name;
      },
      sortAndQuery(sortBy) {
        this.params.sortBy = sortBy;
        this.queryShops();
      },
      goBack() {
        history.back();
      },
      toDetail(id) {
        location.href = "/shop-detail.html?id="+id
      },
      onScroll(e) {
        let scrollTop = e.target.scrollTop;
        let offsetHeight = e.target.offsetHeight;
        let scrollHeight = e.target.scrollHeight;
        if(scrollTop + offsetHeight + 1 > scrollHeight && !this.isReachBottom){
          this.isReachBottom = true
          console.log("触底")
          this.params.current++
          this.queryShops(this.params.current, 5);
        }else{
          this.isReachBottom = false
        }
      },
    }
  })
</script>
</body>
</html>
