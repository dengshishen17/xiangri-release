<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <meta name="description" content="巷里 XIANGRI · 城市生活手边指南">
  <title>巷里 XIANGRI · 城市生活手边指南</title>
  <link rel="stylesheet" href="./css/element.css">
  <link href="./css/main.css" rel="stylesheet">
  <link href="./css/index.css" rel="stylesheet">
</head>
<body>
<div id="app" class="app-index">
  <!-- 顶部品牌栏 -->
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
          <path d="M5 20V11.5L12 6l7 5.5V20" stroke="#F7F4ED" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M9.6 20v-4.6a2.4 2.4 0 0 1 4.8 0V20" stroke="#F0A04B" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="12" cy="4" r="1.2" fill="#F0A04B"/>
        </svg>
      </div>
      <div class="brand-name">巷里<small>XIANGRI</small></div>
    </div>

    <div class="city-pill">杭州 <i class="el-icon-arrow-down"></i></div>

    <div class="topbar-search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/>
      </svg>
      <input type="text" v-model="keyword" placeholder="搜商户、地点" @keyup.enter="doSearch" @input="onSearchInput">
      <!-- 搜索结果下拉 -->
      <div class="search-panel" v-show="searchOpen">
        <div class="sp-head">搜索结果</div>
        <div class="sp-item" v-for="s in searchResults" :key="s.id" @click="toShopDetail(s.id)">
          <div class="sp-thumb"><img :src="s.images ? s.images.split(',')[0] : '/imgs/icons/default-icon.png'" alt=""></div>
          <div class="sp-body">
            <div class="sp-name">{{s.name}}</div>
            <div class="sp-meta">{{s.area}} · ￥{{s.avgPrice}}/人</div>
          </div>
          <svg class="sp-arrow" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 6l6 6-6 6"/>
          </svg>
        </div>
        <div class="sp-empty" v-if="searchResults.length === 0">没有找到相关商户</div>
      </div>
    </div>

    <div class="icon-btn" @click="toPage(4)" title="我的">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8.5" r="3.6"/>
        <path d="M4.8 19.5c1.2-3.4 4-5 7.2-5s6 1.6 7.2 5"/>
      </svg>
    </div>
  </header>

  <!-- 品类网格 -->
  <nav class="type-grid">
    <div class="tg-item" v-for="t in types" :key="t.id" @click="toShopList(t.id, t.name)">
      <span class="tg-icon">
        <img :src="'/imgs' + t.icon" alt="" @error="onImgErr($event)">
      </span>
      <span class="tg-name">{{t.name}}</span>
    </div>
  </nav>

  <!-- 头条大字 -->
  <div class="feed-scroll" @scroll="onScroll">
    <div class="feed">

      <div class="section-head">
        <span class="u-eyebrow">Today's Picks</span>
        <span class="sh-title">今日精选</span>
        <span class="sh-rule"></span>
        <span class="sh-more">城市正在发生 <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg></span>
      </div>

      <!-- 头条精选带 -->
      <div class="lead-card" v-if="blogs.length > 0" @click="toBlogDetail(blogs[0])">
        <div class="lead-cover">
          <img :src="blogs[0].img" alt="" @error="onImgErr($event)">
          <span class="chip chip-accent lead-badge">编辑精选</span>
        </div>
        <div class="lead-body">
          <h2 class="lead-title">{{blogs[0].title}}</h2>
          <div class="lead-meta">
            <span class="lead-author">{{blogs[0].name}}</span>
            <span class="lead-like" @click.stop="addLike(blogs[0])">
              <svg width="13" height="13" viewBox="0 0 24 24" :fill="blogs[0].isLike ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 21H4.6A1.6 1.6 0 0 1 3 19.4V10l4.2-6.4a1.6 1.6 0 0 1 2.8 1.6L9.4 9H18a2 2 0 0 1 2 2.4l-1.4 7A2 2 0 0 1 16.6 20H7z"/>
              </svg>
              {{blogs[0].liked}}
            </span>
          </div>
        </div>
      </div>

      <div class="section-head">
        <span class="u-eyebrow">Nearby</span>
        <span class="sh-title">巷里新鲜事</span>
        <span class="sh-rule"></span>
      </div>

      <!-- 双列瀑布流 -->
      <div class="feed-grid">
        <article class="fc-card" v-for="(b, i) in blogs" :key="b.id" v-show="i > 0" @click="toBlogDetail(b)">
          <div class="fc-cover">
            <img :src="b.img" alt="" @error="onImgErr($event)">
          </div>
          <h3 class="fc-title">{{b.title}}</h3>
          <div class="fc-foot">
            <span class="fc-avatar"><img :src="b.icon || '/imgs/icons/default-icon.png'" alt=""></span>
            <span class="fc-name">{{b.name}}</span>
            <span class="fc-like" @click.stop="addLike(b)">
              <svg width="12" height="12" viewBox="0 0 24 24" :fill="b.isLike ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                <path d="M7 21H4.6A1.6 1.6 0 0 1 3 19.4V10l4.2-6.4a1.6 1.6 0 0 1 2.8 1.6L9.4 9H18a2 2 0 0 1 2 2.4l-1.4 7A2 2 0 0 1 16.6 20H7z"/>
              </svg>
              {{b.liked}}
            </span>
          </div>
        </article>
      </div>

      <div class="feed-end" v-if="isReachBottom">— 到底啦，往回翻翻吧 —</div>
    </div>
  </div>

  <foot-bar :active-btn="1"></foot-bar>
</div>
<script src="./js/vue.js"></script>
<script src="./js/axios.min.js"></script>
<script src="./js/element.js"></script>
<script src="./js/common.js"></script>
<script src="./js/footer.js"></script>
<script>
  const app = new Vue({
    el: "#app",
    data: {
      isReachBottom: false,
      types: [], // 类型列表
      blogs: [], // 播客列表
      current: 1,// blog的页码
      keyword: "", // 搜索关键词
      searchOpen: false,
      searchResults: []
    },
    created() {
      // 查询类型
      this.queryTypes();
      this.queryHotBlogsScroll();
    },
    methods: {
      queryTypes() {
        axios.get("/shop-type/list")
          .then(({data}) => {
            this.types = data;
          })
          .catch(err => {
            this.$message.error(err)
          })
      },
      queryHotBlogsScroll() {
        axios.get("/blog/hot?current=" + this.current)
          .then(({data}) => {
            data.forEach(b => b.img = b.images.split(",")[0]);
            this.blogs = this.blogs.concat(data);
          })
          .catch(err => {
            this.$message.error(err)
          })
      },
      addLike(b) {
        axios.put("/blog/like/" + b.id)
          .then(({data}) => {
            this.queryBlogById(b)
          })
          .catch(err => {
            this.$message.error(err)
          })
      },
      queryBlogById(b) {
        axios.get("/blog/" + b.id)
          .then(({data}) => {
            b.liked = data.liked;
            b.isLike = data.isLike;
          })
          .catch(() => {
            this.$message.error
            b.liked ++;
          })
      },
      onScroll(e) {
        let scrollTop = e.target.scrollTop;
        let clientHeight = e.target.clientHeight;
        let scrollHeight = e.target.scrollHeight;
        // 独立滚动容器触底时 scrollTop + clientHeight 恰好等于 scrollHeight，
        // 故用 >= 并留 2px 容差，保证触底能可靠触发下一页加载
        const atBottom = scrollTop + clientHeight >= scrollHeight - 2;
        if (atBottom) {
          // 已触发过则不再重复请求，避免一次触底连续翻多页
          if (this.isReachBottom) return;
          this.isReachBottom = true;
          // 再次查询下一页数据
          this.current++;
          this.queryHotBlogsScroll();
        } else {
          this.isReachBottom = false;
        }
      },
      // 搜索商户（复用已有商户名称搜索接口）
      doSearch() {
        if (!this.keyword) {
          this.searchOpen = false;
          this.searchResults = [];
          return;
        }
        axios.get("/shop/of/name?name=" + this.keyword)
          .then(({data}) => {
            this.searchResults = data || [];
            this.searchOpen = true;
          })
          .catch(err => {
            this.$message.error(err)
          })
      },
      onSearchInput() {
        if (!this.keyword) {
          this.searchOpen = false;
          this.searchResults = [];
        }
      },
      // 图片加载失败时降级为品牌占位图
      onImgErr(e) {
        const img = e && e.target;
        if (!img || img.dataset.fallback) return;
        img.dataset.fallback = "1";
        img.src = "/imgs/icons/default-icon.png";
      },
      toShopDetail(id) {
        this.searchOpen = false;
        location.href = "/shop-detail.html?id=" + id
      },
      toShopList(id, name) {
        location.href = "/shop-list.html?type=" + id + "&name=" + name
      },
      toBlogDetail(b) {
        location.href = "/blog-detail.html?id=" + b.id
      },
      toPage(i) {
        if (i === 4) {
          location.href = "/info.html"
        }
      }
    }
  })
</script>
</body>
</html>
